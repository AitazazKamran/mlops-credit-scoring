global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # PSI / drift exporter (Phase 8)
  - job_name: "psi-exporter"
    static_configs:
      - targets: ["host.docker.internal:8000"]   # runs on host, not in Docker

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]